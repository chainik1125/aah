remote:
  host: "YOUR_HOST_IP"
  port: 22112
  user: "root"
  # Path to SSH key file. If the file doesn't exist, falls back to
  # RUNPOD_SSH_KEY environment variable (for cloud deployments).
  key_path: "~/.ssh/id_ed25519"

paths:
  project_root: "/path/to/your/aah"
  remote_project_root: "~/aah"
  tex_images: "/path/to/your/tex/images"

rsync:
  excludes:
    - ".venv/"
    - ".git/"
    - "large_files/"
    - "__pycache__/"
    - "*.pyc"
    - "logs/"
